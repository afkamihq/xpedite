# School Grounds, economy first and shield-proof (10 Nov 2026). Built for the Regular
# Challenge on Act 1 Hard (Shielded: 2 shields each, Speedy +43%, Sprinter, Tank), and meant
# to win Normal and Hard as well. The old Normal plan is normal_v1.yaml.
# - The path is one short S down the middle, so enemies cross it fast. Shields absorb whole
#   attacks, so many-hit units strip them where the S doubles back: Forbidden Teacher
#   (4 hits, 800, limit 4) and First Blade (4 hits). Teachers also buff Magical units in
#   range, and Atom is Magical, so they sit beside the Atoms.
# - Stone Alchemists far away at the bottom left, on the game's own Auto Upgrade.
# - Atom #1 goes to UPG 7: Complete Nuclear hits every enemy on the map and ignores shields.
# Spots are in reference.png's pixels (yaw +28, zoom in 2), from the spot scan or proven.
